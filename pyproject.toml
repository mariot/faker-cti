[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faker-cti"
version = "0.1.0"
description = "Faker providers for cyber threat intelligence and adversarial exposure validation test data (STIX 2.1, OpenCTI, OpenAEV, MITRE ATT&CK, EDR alerts)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mariot Tsitoara", email = "mariot.tsitoara@filigran.io" }]
keywords = ["faker", "factory-boy", "stix", "opencti", "openaev", "threat-intelligence", "mitre-attack", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
    "Typing :: Typed",
]
dependencies = ["faker>=20.0"]

[project.urls]
Homepage = "https://github.com/FiligranHQ/faker-cti"
Repository = "https://github.com/FiligranHQ/faker-cti"
Issues = "https://github.com/FiligranHQ/faker-cti/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "stix2>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/faker_cti"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["faker_cti"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
